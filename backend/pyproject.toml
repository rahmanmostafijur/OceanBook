[project]
name = "oceanbook-backend"
version = "0.1.0"
description = "OceanBook API, workers and migrations"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.142,<0.143",
    "uvicorn[standard]>=0.54,<0.55",
    "pydantic[email]>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "sqlalchemy[asyncio]>=2.1,<2.2",
    "asyncpg>=0.31,<0.32",
    "alembic>=1.20,<2",
    "redis>=6.4,<6.5",  # kombu 5.6 (Celery transport) requires redis<6.5
    "celery[redis]>=5.6,<5.7",
    "structlog>=26.1",
    "argon2-cffi>=25.1",
    "pyjwt[crypto]>=2.15,<3",
    "cryptography>=50",
    "orjson>=3.12",
    "httpx>=0.28",
    "pyotp>=2.10",
    "phonenumbers>=9.0",
    "tzdata>=2025.2",  # IANA zones for zoneinfo on platforms without a system database (Windows, slim images)
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "respx>=0.23",
    "fakeredis[lua]>=2.38",
    "hypothesis>=6.168",
    "ruff>=0.16",
    "mypy>=2.3",
    "import-linter>=2.15",
    "celery-types>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PTH", "T20", "DTZ"]
ignore = ["S101"]  # asserts are allowed in tests (per-file below) and type-narrowing

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]
"migrations/**" = ["E501"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/versions/"]

[[tool.mypy.overrides]]
module = ["celery.*", "fakeredis.*", "pyotp.*", "phonenumbers.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: needs PostgreSQL (TEST_DATABASE_URL)",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/cli.py"]
concurrency = ["greenlet", "thread"]  # SQLAlchemy async runs ORM code on greenlets

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

# ---------------------------------------------------------------- import-linter
[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "core and platform do not depend on domain modules"
type = "forbidden"
source_modules = ["app.core", "app.platform"]
forbidden_modules = ["app.identity", "app.worker"]

[[tool.importlinter.contracts]]
name = "domain layers: api -> services -> repositories -> models"
type = "layers"
containers = ["app.identity"]
layers = ["api", "services", "repositories", "models"]
exhaustive = false
