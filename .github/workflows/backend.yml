name: backend

on:
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: valkey/valkey:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/postgres
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --frozen
      - name: Lint and format
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy app tests
      - name: Module boundaries
        run: uv run lint-imports
      - name: Tests (unit + integration, incl. migration drift and down/up cycle)
        run: uv run pytest --cov --cov-report=term-missing
      - name: Dependency audit
        run: uvx pip-audit --strict --progress-spinner off -r <(uv export --frozen --no-dev --no-hashes --no-emit-project)
        shell: bash

  image:
    runs-on: ubuntu-24.04
    needs: checks
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          load: true
          tags: oceanbook-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image (Trivy)
        # Run the scanner directly (pinned) so findings and tool errors are reported as annotations.
        run: |
          set +e
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock             -e TRIVY_DB_REPOSITORY=public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2             aquasec/trivy:0.65.0 image --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed             --format json --exit-code 1 oceanbook-backend:${{ github.sha }} > trivy.json 2> trivy.err
          code=$?
          python3 - <<'PY'
          import json
          try:
              data = json.load(open("trivy.json"))
          except ValueError:
              data = {}
          for result in data.get("Results", []):
              for v in result.get("Vulnerabilities") or []:
                  print(f"::error::{v['VulnerabilityID']} {v['PkgName']} {v['InstalledVersion']} fixed in {v.get('FixedVersion')} ({v['Severity']})")
          for line in open("trivy.err").read().splitlines()[-6:]:
              print(f"::error::trivy: {line[:300]}")
          PY
          echo "trivy exit code: $code"
          exit $code
