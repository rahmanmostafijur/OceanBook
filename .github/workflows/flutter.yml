name: flutter

on:
  pull_request:
    paths: ["apps/**", "packages/**", "pubspec.yaml", "analysis_options.yaml", ".github/workflows/flutter.yml"]
  push:
    branches: [main]
    paths: ["apps/**", "packages/**", "pubspec.yaml", "analysis_options.yaml", ".github/workflows/flutter.yml"]

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.5" # pinned; see docs/development/toolchain.md

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed apps packages
      - name: Analyze (whole workspace)
        run: |
          for p in packages/design_system packages/ob_core packages/ob_l10n packages/reader_core apps/mobile apps/admin; do
            (cd "$p" && flutter analyze --fatal-infos) || exit 1
          done
      - name: Tests
        run: |
          for p in packages/design_system packages/ob_core apps/mobile apps/admin; do
            (cd "$p" && flutter test) || exit 1
          done

  build-web-admin:
    runs-on: ubuntu-24.04
    needs: checks
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build web --release
        working-directory: apps/admin

  build-android:
    runs-on: ubuntu-24.04
    needs: checks
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
        working-directory: apps/mobile
