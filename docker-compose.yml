# Local development stack. Production runs the same image on ECS behind an ALB (docs/architecture/01 §12).
name: oceanbook

x-backend: &backend
  build: ./backend
  image: oceanbook-backend:local   # one image, five roles
  env_file: ./backend/.env
  environment:
    OB_DATABASE_URL: postgresql+asyncpg://oceanbook:oceanbook@postgres:5432/oceanbook
    OB_REDIS_URL: redis://redis:6379/0
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: oceanbook
      POSTGRES_PASSWORD: oceanbook   # local only
      POSTGRES_DB: oceanbook
    ports: ["5433:5432"]               # 5433 avoids clashing with a locally installed PostgreSQL
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oceanbook -d oceanbook"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: valkey/valkey:8-alpine      # Redis-protocol compatible; matches ElastiCache (Valkey) in production
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    <<: *backend
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    <<: *backend
    command: ["celery", "-A", "app.worker.celery_app:celery_app", "worker", "--loglevel=INFO",
              "--queues=default,media,payments,imports,analytics", "--concurrency=2"]
    healthcheck:   # the image's HTTP check only applies to the api role
      test: ["CMD-SHELL", "celery -A app.worker.celery_app:celery_app inspect ping -d celery@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      migrate: { condition: service_completed_successfully }

  scheduler:
    <<: *backend
    # Exactly one scheduler per environment (ECS service with desired count 1).
    command: ["celery", "-A", "app.worker.celery_app:celery_app", "beat", "--loglevel=INFO",
              "--schedule=/tmp/celerybeat-schedule"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celerybeat-schedule"]
      interval: 30s
      retries: 3
    depends_on:
      migrate: { condition: service_completed_successfully }

  relay:
    <<: *backend
    command: ["python", "-m", "app.worker.relay"]
    healthcheck:   # the relay touches this file after every poll (stale file = stuck loop)
      test: ["CMD-SHELL", "find /tmp/relay-heartbeat -mmin -1 | grep -q ."]
      interval: 30s
      retries: 3
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
